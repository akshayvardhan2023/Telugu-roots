<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>లీడర్‌బోర్డ్</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .leaderboard-table {
      width: 100%;
      max-width: 500px;
      margin: 2em auto;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 24px #7c3aed18;
    }
    .leaderboard-table th, .leaderboard-table td {
      padding: 1em;
      text-align: center;
      border-bottom: 1px solid #f3e8ff;
    }
    .leaderboard-table th {
      background: #7c3aed;
      color: #fff;
    }
    .leaderboard-table tr:last-child td {
      border-bottom: none;
    }
    .gold { color: #fbbf24; font-weight: bold; }
    .silver { color: #a3a3a3; font-weight: bold; }
    .bronze { color: #f59e42; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">🌿 తెలుగు రూట్స్</div>
      <ul>
        <li><a href="index.html">హోమ్</a></li>
        <li><a href="about.html">గురించి</a></li>
        <li><a href="features.html">ఫీచర్లు</a></li>
        <li><a href="contact.html">సంప్రదించండి</a></li>
      </ul>
    </nav>
  </header>
  <section class="hero animated-hero">
    <h1>లీడర్‌బోర్డ్</h1>
    <table class="leaderboard-table">
      <tr>
        <th>స్థానం</th>
        <th>పేరు</th>
        <th>స్కోర్</th>
      </tr>
      <tr>
        <td class="gold">🥇 1</td>
        <td>అన్విత</td>
        <td>98</td>
      </tr>
      <tr>
        <td class="silver">🥈 2</td>
        <td>వేదాంత్</td>
        <td>95</td>
      </tr>
      <tr>
        <td class="bronze">🥉 3</td>
        <td>సాహితి</td>
        <td>92</td>
      </tr>
      <tr>
        <td>4</td>
        <td>రాహుల్</td>
        <td>89</td>
      </tr>
      <tr>
        <td>5</td>
        <td>ప్రణయ్</td>
        <td>87</td>
      </tr>
    </table>
    <p style="margin-top:1.5em;">
      <a href="index.html" class="btn-secondary">వెనక్కి వెళ్ళండి</a>
    </p>
  </section>
  <footer>
    <p>❤️ జై తెలుగు తల్లి! © 2025 తెలుగు రూట్స్</p>
  </footer>
</body>
</html>
